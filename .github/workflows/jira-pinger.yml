name: jira-pinger

on:
  schedule:
    # Every 15 minutes, off the top of the hour. GitHub often skips scheduled runs, so more
    # slots means at least one run per hour. state.json prevents repeat DMs. The script does the
    # hourly work about once an hour and only table watch on the other passes.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      force_full:
        description: 'Run the hourly work (status pings, channel posts, daily list) even if it is not due yet'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: jira-pinger
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests tzdata

      - name: Run Jira pinger
        env:
          JIRA_SITE: ${{ secrets.JIRA_SITE }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}
          # Optional. When this secret exists, resolved techsupport issues are also posted to that Slack channel.
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          # Optional JSON of Slack IDs for the agents tagged in channel posts.
          SLACK_MENTIONS: ${{ secrets.SLACK_MENTIONS }}
          # Table watch (off unless the repository variable TABLE_WATCH_ENABLED is true; dry run unless TABLE_WATCH_DRY_RUN is false).
          TABLE_WATCH_ENABLED: ${{ vars.TABLE_WATCH_ENABLED }}
          TABLE_WATCH_DRY_RUN: ${{ vars.TABLE_WATCH_DRY_RUN }}
          TABLE_WATCH_CHANNEL: ${{ vars.TABLE_WATCH_CHANNEL }}
          TABLE_WATCH_LABEL: ${{ vars.TABLE_WATCH_LABEL }}
          FORCE_FULL: ${{ inputs.force_full }}
        run: python jira_pinger.py

      - name: Commit state.json if it changed
        run: |
          if [ -f state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            if git diff --cached --quiet; then
              echo "state.json unchanged"
            else
              git commit -m "Update Jira pinger state [skip ci]"
              # Other workflows also push to main, so rebase onto their commits first.
              git pull --rebase origin main
              git push
            fi
          fi
